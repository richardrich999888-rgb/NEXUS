version: '3.8'

services:
  # AGP-OS Core API
  agp-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AGP_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Dashboard (served by API)
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    ports:
      - "3000:3000"
    depends_on:
      - agp-api
    environment:
      - API_URL=http://agp-api:8000
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
