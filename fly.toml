# Fly.io configuration for NEXUS
# https://fly.io/docs/reference/configuration/

app = "nexus-substrate"
primary_region = "sin"  # Singapore - close to India

[build]
dockerfile = "Dockerfile"

[env]
RUST_LOG = "info"
DATA_DIR = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256

[mounts]
source = "nexus_data"
destination = "/data"
