[package]
name = "nexus-core"
version = "0.1.0"
edition = "2021"
authors = ["SYNTRIASS Labs"]
license = "Apache-2.0"

[workspace]

[dependencies]
sha2 = "0.10"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
wasmtime = "16.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
