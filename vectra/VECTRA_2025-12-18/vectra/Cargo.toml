[package]
name = "vectra"
version = "0.1.0"
edition = "2021"
authors = ["SYNTRIASS LABS"]
description = "Deterministic, lossless data volume reduction for structured payloads"
license = "Proprietary"
repository = "https://github.com/syntriass/vectra"

[lib]
name = "vectra"
path = "src/lib.rs"

[dependencies]
# Cryptographic hashing for integrity verification
sha2 = "=0.10.8"
# Serialization for artifact format
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
# Byte manipulation
bytes = "=1.5.0"
# Error handling
thiserror = "=1.0.50"
# Constructor functions for build verification
ctor = "0.2"
# Hex encoding for signatures and fingerprints
hex = "0.4"
# UUID generation for license IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
# Property-based testing for invariant verification
proptest = "=1.4.0"
# Criterion for determinism benchmarks
criterion = "=0.5.1"

[features]
default = []
# Enable verbose logging for debugging (never in production artifacts)
debug-logging = []

[[bench]]
name = "determinism"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
