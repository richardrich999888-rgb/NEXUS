apiVersion: v1
kind: Service
metadata:
  name: fyntrax-xapp
  namespace: ricxapp
  labels:
    app: fyntrax
    component: xapp
spec:
  type: ClusterIP
  selector:
    app: fyntrax
    component: xapp
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
