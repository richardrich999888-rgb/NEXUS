[package]
name = "homeostasis-engine"
version = "0.1.0"
edition = "2021"
authors = ["NEXUS Team"]
description = "Constraint enforcement substrate for bio-inspired ASI safety"
license = "MIT"
repository = "https://github.com/nexus/homeostasis-engine"
keywords = ["ai-safety", "homeostasis", "control-systems", "constraints"]
categories = ["science", "algorithms"]

[lib]
name = "homeostasis_engine"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# Optional: for advanced solvers
nalgebra = { version = "0.32", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
# Note: kani verification is done via 'cargo kani' command, not as a dependency

[features]
default = []
advanced-solver = ["nalgebra"]

[[test]]
name = "single_metric"
path = "tests/single_metric_tests.rs"

[[test]]
name = "multi_objective"
path = "tests/multi_objective_tests.rs"

[[test]]
name = "integration"
path = "tests/integration_tests.rs"
