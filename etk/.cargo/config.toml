# Regulator-grade hardening. Strip symbols, minimize size, no debuginfo in release path.
# opt-level and debuginfo for release are also set in Cargo.toml [profile.release].
[build]
rustflags = [
  "-C", "link-arg=-s",
  "-C", "debuginfo=0",
]

# Use clang linker for Linux target when available (reproducibility).
# Requires: clang, lld (e.g. sudo apt install clang lld)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
