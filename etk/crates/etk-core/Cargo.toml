[package]
name = "etk-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ETK cryptographic kernel — crypto, codec, genesis, chain, proof, verifier"

[dependencies]
etk-types = { path = "../etk-types" }
sha2 = "0.10"
blake3 = { version = "1.5", optional = true }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
thiserror = "1.0"

[features]
default = []
# Crypto agility: enable Blake3 for future schema versions or migration.
blake3 = ["dep:blake3"]

[dev-dependencies]
rand = "0.8"
