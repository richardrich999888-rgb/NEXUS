[workspace]
members = [
    "nexus-core",
    "nexus-pcu",
    "nexus-sync",
    "nexus-compress",
    "nexus-storage",
    "nexus-network",
    "nexus-runtime",
    "nexus-cli",
    "nexus-server",
    "nexus-observability",
    "nexus-secrets",
    "causalux",
    "vectra/vectra",
    "nexus-executor", "nexus-edge", "nexus-benchmarks",
    "nexus-etk",
    "nexus-agp",
    "homeostasis-engine",
    "multi-asi-immune",
    "autonomic-system",
    "developmental-gates",
    "nervous-system",
    "telos-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Katta Naga Sri Ganesh <ganesh@syntriass.com>"]
license = "Apache-2.0 OR Commercial"
repository = "https://github.com/syntriass/nexus"
homepage = "https://syntriass.com"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ed25519-dalek = "2.0"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Observability
prometheus = { version = "0.13", features = ["process"] }

# Encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
pbkdf2 = "0.12"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
